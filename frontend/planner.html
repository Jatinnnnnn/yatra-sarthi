<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trip Planner — Yatra Sarthi</title>
<link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<div class="page-banner" style="background-image:url('/static/img/valley_of_flowers.jpg')">
  <div class="page-banner-overlay"></div>
  <div class="page-banner-text"><h1>Trip Planner</h1><p>Weather-checked, day-wise itineraries with cost estimates</p></div>
</div>

<section class="section">
  <div class="planner-grid">
    <form class="planner-form card" id="planForm">
      <label>Destination / Region
        <select name="destination">
          <option value="">Let Yatra Sarthi choose</option>
          <option>Nainital</option><option>Rishikesh</option><option>Mussoorie</option>
          <option>Haridwar</option><option>Auli</option><option>Chopta</option>
          <option>Kedarnath</option><option>Badrinath</option><option>Jim Corbett</option>
          <option>Kausani</option><option>Munsiyari</option><option>Dehradun</option>
        </select>
      </label>
      <div class="form-row">
        <label>Days <input type="number" name="days" min="1" max="9" value="4" /></label>
        <label>Month
          <select name="month">
            <option value="">Current</option>
            <option value="1">January</option><option value="2">February</option>
            <option value="3">March</option><option value="4">April</option>
            <option value="5">May</option><option value="6">June</option>
            <option value="7">July</option><option value="8">August</option>
            <option value="9">September</option><option value="10">October</option>
            <option value="11">November</option><option value="12">December</option>
          </select>
        </label>
      </div>
      <div class="form-row">
        <label>Budget (₹, total) <input type="number" name="budget" min="1000" step="500" placeholder="optional" /></label>
        <label>Travelling as
          <select name="group_type">
            <option value="">Any</option>
            <option value="family">Family</option><option value="friends">Friends</option>
            <option value="couple">Couple</option><option value="solo">Solo</option>
          </select>
        </label>
      </div>
      <fieldset class="interests">
        <legend>Interests</legend>
        <label><input type="checkbox" name="interests" value="adventure" />Adventure</label>
        <label><input type="checkbox" name="interests" value="pilgrimage" />Pilgrimage</label>
        <label><input type="checkbox" name="interests" value="nature" />Nature</label>
        <label><input type="checkbox" name="interests" value="wildlife" />Wildlife</label>
        <label><input type="checkbox" name="interests" value="heritage" />Heritage</label>
        <label><input type="checkbox" name="interests" value="hill_station" />Hill stations</label>
      </fieldset>
      <button class="btn btn-primary btn-block" type="submit">Generate Itinerary</button>
    </form>
    <div class="plan-output" id="planOutput">
      <div class="plan-placeholder card">
        <span class="ph-icon">🗺️</span>
        <p>Your day-wise plan will appear here — with weather flags, automatic
        replanning for risky days, and a cost estimate.</p>
      </div>
    </div>
  </div>
</section>

<footer class="footer">
  <p><strong>Yatra Sarthi</strong> · SIH 2026 · PS 26204</p>
</footer>

<script src="/static/js/common.js"></script>
<script src="/static/js/planner.js"></script>
</body>
</html>
